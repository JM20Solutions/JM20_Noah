body{margin:0;font:400 17px/1.47 var(--font);letter-spacing:-.374px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit;letter-spacing:-.224px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
::selection{background:rgba(0,102,204,.22)}
:focus-visible{outline:2px solid var(--acf);outline-offset:2px}
input,select{accent-color:var(--ac);caret-color:var(--ac)}

/* Buttons: pill grammar, press = scale(.95) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 22px;border:1px solid var(--ac);border-radius:9999px;background:transparent;color:var(--ac);font-size:14px;font-weight:400;line-height:1;cursor:pointer;white-space:nowrap;transition:transform 180ms var(--ez),background-color 180ms var(--ez),color 180ms var(--ez)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent}

input,select{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
label{display:grid;gap:6px;font-size:14px;font-weight:600;letter-spacing:-.224px}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lc{display:grid;gap:14px;width:100%;max-width:380px;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.lc h1{margin:0;font-size:28px;font-weight:600;line-height:1.14;letter-spacing:-.28px}
.lc .btn{width:100%}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.scroll{flex:1;min-height:0;overflow:auto;scrollbar-color:#c7c7cc transparent;scrollbar-width:thin}

/* Global nav: true black, 44px. Status left, title centre, shop + exit right */
.top{flex:none;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 24px 0;background:#000;color:#fff}
.top h1{margin:0;font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.224px;text-align:center}
.live{display:inline-flex;align-items:center;gap:8px;justify-self:start;font-size:12px;letter-spacing:-.12px;color:#ccc}
.dot{width:8px;height:8px;border-radius:50%;background:#86868b}
.live.up{color:#fff}
.live.up .dot{background:#30d158}
.right{display:flex;align-items:center;gap:14px;justify-self:end;min-width:0}
#shop{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;letter-spacing:-.12px;color:#ccc}
.top .btn{min-height:28px;padding:0 14px;border-color:#6e6e73;color:#fff;font-size:12px;letter-spacing:-.12px}

/* Sub nav: frosted, sticky. Title left, controls right */
.bar{position:sticky;top:0;left:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 24px;background:rgba(245,245,247,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-right:auto;min-width:0}
#dl{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px}
#cnt{font-size:14px;color:var(--mut);letter-spacing:-.224px}
.seg{display:inline-flex;align-items:center;padding:3px;border-radius:9999px;background:var(--chip)}
.seg .btn{min-height:38px;position:relative}
.seg .btn::after{content:"";position:absolute;inset:-3px 0}
.seg .btn{border-color:transparent;color:var(--ink);padding:0 18px}
.seg .ic{width:44px;padding:0}
#td{min-width:84px;font-weight:600}
.vw .btn{padding:0 16px}
.vw .btn[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}
.bar select{width:auto;min-height:44px;padding:0 16px;border:0;border-radius:9999px;background:var(--chip);font-size:14px;font-weight:600}
.bar input[type=date]{width:auto;min-height:44px;padding:0 16px;border:0;border-radius:9999px;background:var(--chip);font-size:14px;color-scheme:light}
.bar .pri{padding:0 20px}

/* Legend doubles as the day summary */
.leg{position:sticky;left:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;margin:0;padding:16px 24px 12px;font-size:12px;letter-spacing:-.12px;color:var(--ink)}
.leg>span{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.leg em{font-style:normal}
.leg u{text-decoration:none}
#cal{display:none;width:44px;padding:0;border-color:transparent;background:var(--chip);color:var(--ink)}
.leg b{font-weight:600;font-variant-numeric:tabular-nums}
.leg .sep{width:1px;height:14px;background:var(--line)}
.pt{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%}
.pt.ph{background:var(--auto)}
.pt.mn{width:14px;height:14px;margin:0 1px;border-radius:4px;background:var(--man)}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px}
.sw.free{background:#fff;border:1px solid #c7c7cc}
.sw.off{background:var(--off);border:1px solid var(--offline)}
#note{position:sticky;left:0;padding:0 24px 10px;font-size:14px}
#note:empty{display:none}
#note.bad{color:var(--bad)}
#note .btn{min-height:32px;margin-left:10px;padding:0 14px}

/* Schedule grid */
.wrap{padding:0 24px 40px}
#grid{display:grid;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:clip;font-variant-numeric:tabular-nums;transition:opacity 180ms var(--ez)}
#grid.busy{opacity:.4;pointer-events:none}
.hd{position:sticky;top:var(--barh,0px);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:10px 8px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.224px;text-align:center}
.hd small{font-size:12px;font-weight:400;letter-spacing:-.12px;color:var(--mut)}
.hdb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 10px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:400}
.hdb small{font-size:12px;font-weight:400;letter-spacing:-.12px;color:var(--mut);text-transform:capitalize}
.dn{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9999px;font-size:17px;font-weight:600;letter-spacing:-.374px}
.hd.today .dn{background:var(--ac);color:#fff}
.hd:first-child{left:0;z-index:6}
.gut{position:sticky;left:0;z-index:4;background:var(--card)}
.gut span{position:absolute;right:10px;transform:translateY(-50%);font-size:12px;letter-spacing:-.12px;color:var(--mut)}
.gut span:first-child{transform:translateY(6px)}
.gut .nowt{z-index:3;padding:3px 6px;border-radius:9999px;background:var(--bad);color:#fff;font-weight:600;right:6px}
.col{position:relative;border-left:1px solid var(--line);background-color:var(--off);background-image:linear-gradient(to bottom,transparent calc(var(--hr) - 1px),var(--offline) 0);background-size:100% var(--hr)}
.av{position:absolute;left:0;right:0;background-color:var(--card);background-image:linear-gradient(to bottom,transparent calc(var(--hr) - 1px),var(--soft) 0);background-size:100% var(--hr)}
.now{position:absolute;left:0;right:0;z-index:3;height:0;border-top:2px solid var(--bad);pointer-events:none}

/* Booking tile: dark surface, white text, saturated source dot */
.bk{position:absolute;left:5px;right:5px;display:flex;flex-direction:column;gap:1px;padding:6px 12px;overflow:hidden;border:0;border-radius:8px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-b);color:var(--tile-t);text-align:left;cursor:pointer;transition:background-color 180ms var(--ez),transform 180ms var(--ez)}
.bk:active{transform:scale(.98)}
.bk:focus-visible{outline-color:var(--acf);outline-offset:1px}
.l1{display:flex;align-items:center;gap:10px;min-width:0}
.nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;font-weight:700;line-height:1.3}
.l2{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:600;line-height:1.3;letter-spacing:-.12px;color:var(--tile-s)}
.bk.sm{flex-direction:row;align-items:center;gap:10px;padding:0 12px}
.bk.sm .l1{flex:0 1 auto;max-width:60%}
.bk.sm .l2{flex:1 1 0;min-width:0}
.bk.wn.sm .l2{display:none}

/* Dialogs */
dialog{width:min(420px,92vw);padding:24px;border:0;border-radius:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog h2{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px}
dialog p{margin:0 0 8px}
.kv{display:grid;margin:14px 0 0;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:-.224px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:600;text-align:right}
.kv a{color:var(--ac);text-decoration:none}
.stack{display:grid;gap:14px;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.mut{color:var(--mut)}
.err{min-height:1.2em;margin:8px 0 0;font-size:14px;color:var(--bad)}

/* Stats */
#sv .bar{padding-left:max(24px,calc((100% - 1100px) / 2));padding-right:max(24px,calc((100% - 1100px) / 2))}
#sl{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px}
#sb{display:grid;gap:24px;max-width:1100px;margin:0 auto;transition:opacity 180ms var(--ez)}
#sb.busy{opacity:.4;pointer-events:none}
.lead{margin:0;padding-top:20px;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:.231px;text-wrap:balance}
.lead span{display:block;margin-top:6px;font-size:15px;font-weight:400;letter-spacing:-.224px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;overflow:hidden}
.panel h2{margin:0;font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.374px}
.panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.panel th,.panel td{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;text-align:right}
.panel th:first-child{text-align:left}
.panel thead th{padding-top:0;font-size:12px;font-weight:400;color:var(--mut)}
.panel tbody th{font-weight:600}
.panel tbody tr:last-child{font-weight:600}
.panel tbody tr:last-child th,.panel tbody tr:last-child td{border-bottom:0;padding-bottom:0}
.svc tbody th{padding-right:12px;font-weight:400}
.svc tbody tr:last-child th{font-weight:600}
.panel thead .pt{width:10px;height:10px;margin:0}
.nmc{display:inline-flex;align-items:center;gap:10px}
.ph2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
.lgd{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.lgd .pt{width:10px;height:10px;margin:0}
.lgd .pt+.pt,.lgd .pt:not(:first-child){margin-left:6px}
.lgd b{margin-left:10px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cht{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--line);background-image:linear-gradient(to bottom,var(--soft) 1px,transparent 1px);background-size:100% 45px}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bc i{display:block;width:100%;border-radius:2px 2px 0 0}
.bc .a{background:var(--auto)}
.bc .m{background:var(--man)}
.ax{display:flex;gap:3px;margin-top:6px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ax span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.fn{margin:0;font-size:13px;color:var(--mut)}
@media (max-width:640px){.top{grid-template-columns:auto 1fr auto;gap:10px}#lt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}#sv .bar{padding-left:14px;padding-right:14px}#sl{font-size:19px}.lead{font-size:19px;padding-top:12px}.panel{padding:16px 14px}.cht{height:150px;background-size:100% 37.5px}}
@media (hover:hover){
  .btn:hover{background:rgba(0,102,204,.08)}
  .btn.pri:hover{background:var(--acf)}
  .btn.bad:hover{background:rgba(215,0,21,.08)}
  .top .btn:hover{background:rgba(255,255,255,.12)}
  .seg .btn:hover{background:rgba(0,0,0,.07)}
  .hdb:hover{background:rgba(0,0,0,.05)}
  .bk:hover{background:var(--tile-h)}
}

@media (max-width:640px){
  .top{padding-left:14px;padding-right:14px}
  #shop{display:none}
  .top h1{font-size:13px}
  /* Header: title + calendar on row 1; view toggle + prev/Hoy/next on row 2 */
  .bar{position:sticky;top:auto;left:0;gap:10px;padding:12px 14px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .ttl{flex:1 1 calc(100% - 54px);min-width:0}
  #dl{font-size:19px}
  #cal{display:inline-flex}
  .vw{flex:none}
  .seg:not(.vw){flex:1 1 0}
  .seg:not(.vw) .btn{padding:0}
  .seg:not(.vw) #td{flex:1 1 auto}
  .bar input[type=date]{position:absolute;width:1px;height:1px;min-height:0;padding:0;opacity:0;pointer-events:none}
  .bar select{flex:1 1 100%;font-size:16px}
  /* Primary action sits in the thumb zone */
  .bar .pri{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;min-height:52px;padding:0 24px;font-size:16px}
  .leg{padding:12px 14px 8px;gap:6px 18px}
  .leg .opt,.leg .sep,.leg .lg{display:none}
  #note{padding-left:14px;padding-right:14px}
  .wrap{padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .hd{min-height:52px;padding:8px 6px}
  .gut span{right:6px}
  /* Dialogs become bottom sheets */
  dialog{width:100%;max-width:none;margin:auto 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}
  .row .btn{flex:1 1 100%}
}
@media (pointer:coarse){
  .top .btn{position:relative}
  .top .btn::after{content:"";position:absolute;inset:-8px -6px}
}
@media (max-height:500px) and (max-width:900px){
  .bar .pri{min-height:44px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}

      <button class="btn" id="out">Salir</button>

    <div class="seg vw" id="vw" role="group" aria-label="Vista"><button class="btn" data-v="day" aria-pressed="true">Día</button><button class="btn" data-v="week" aria-pressed="false">Semana</button></div>
    <div class="seg">
      <button class="btn ic" id="pv" aria-label="Día anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" id="td" title="Ir a hoy">Hoy</button>
      <button class="btn ic" id="nx" aria-label="Día siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <input type="date" id="dp" aria-label="Elegir día">
    <select id="bs" aria-label="Barbero" hidden></select>
    <button class="btn pri" id="nw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva reserva</button>

  <p class="leg">
    <span><i class="pt ph"></i><em><u class="lg">Reserva </u>IA</em> <b id="ca">0</b></span>
    <span><i class="pt mn"></i><em><u class="lg">Reserva </u>manual</em> <b id="cm">0</b></span>

    <span class="opt"><i class="sw off"></i>Fuera de horario</span>

  <div class="mut" id="note" role="status"></div>
  <div class="wrap"><div id="grid" aria-busy="false"></div></div>
  </div>
  <div class="scroll" id="sv" hidden>
    <div class="bar">
      <div class="ttl"><span id="sl"></span></div>
      <div class="seg vw" id="mt" role="group" aria-label="Mostrar"><button class="btn" data-m="ok" aria-pressed="true">Reservas</button><button class="btn" data-m="can" aria-pressed="false">Canceladas</button></div>
      <div class="seg">
        <button class="btn ic" id="sp" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="btn" id="sc">Este mes</button>
        <button class="btn ic" id="sx" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="wrap"><div id="sb" aria-busy="false"></div></div>
  </div>
</main>
<dialog id="dlg"></dialog>

    const cur = weekStart(fd(new Date())) === ws;

}

// Login and session
const authMsg = er => er.code === 'invalid_credentials' || er.status === 400 ? 'Correo o contraseña incorrectos.'
  : er.status === 429 ? 'Demasiados intentos. Espera un momento e inténtalo de nuevo.'
  : 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.';
$('lf').onsubmit = async e => {
  e.preventDefault();
  const b = $('lb');
  if (b.disabled) return;
  b.disabled = true; $('le').textContent = '';
  try {
    const {error} = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
    if (error) $('le').textContent = authMsg(error);
  } catch (x) { $('le').textContent = authMsg({}); }
  finally { b.disabled = false; }
};
$('out').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((ev, s) => {
  if (s && !started) { started = true; setTimeout(start, 0); }
  if (!s && started) { started = false; stop(); }

let gen = 0;
function fail(t) {
  const n = $('note');
  n.className = 'mut bad';
  n.replaceChildren(t, h('button', {class: 'btn', onclick: () => { n.replaceChildren(); n.className = 'mut'; start(); }}, 'Reintentar'));
}

    sb.rpc('my_shop'),

  if (!alive()) return;

  bsel = barbers.length ? barbers[0].id : null;
  $('bs').replaceChildren(...barbers.map(x => h('option', {value: x.id}, x.name)));

    .on('postgres_changes', {event: '*', schema: 'public', table: 'bookings'}, () => tick())

}

// Data and drawing
async function load() {
  const d = day, v = view;
  const ws = v === 'week' ? weekStart(d) : d, we = v === 'week' ? addDays(ws, 6) : d;

  if (d !== day || v !== view) return; // a newer day or view was picked while this request was in flight
  if (error) {
    // Never leave another day's bookings under this day's label.
    if (drawn !== view + day) $('grid').replaceChildren();
    busy(false);
    const n = $('note');
    n.className = 'mut bad';
    n.replaceChildren('No se pudieron cargar las reservas.', h('button', {class: 'btn', onclick: () => { busy(true); load(); }}, 'Reintentar'));
    return;

  draw();
}
function draw() {
  drawn = view + day; busy(false); $('note').className = 'mut';
  head();
  const wk = view === 'week', today = fd(new Date());

  const cols = wk

  };

  g.style.minWidth = (gw + cols.length * cw) + 'px';

  cols.forEach(c => {
    const n = nres(colBk(c).length);
    g.append(wk
      ? h('div', {class: 'hd' + (c.date === today ? ' today' : '')},
          h('button', {class: 'hdb', title: 'Ver este día', 'data-k': 'd' + c.date, onclick: () => { day = c.date; setView('day'); }},
            h('small', {}, fmt(c.date, {weekday: 'short'})), h('span', {class: 'dn'}, String(+c.date.slice(8)))),

  });

      col.append(h('button', {class: 'bk ' + kind + (ht < 46 ? ' sm' : '') + (wk && nar ? ' wn' : ''),
        style: 'top:' + (s - lo) * PM + 'px;height:' + ht + 'px;left:calc(5px + (100% - 10px) * ' + lane + ' / ' + lanes + ');width:calc((100% - 10px) / ' + lanes + ');right:auto', 'data-k': 'b' + r.id, onclick: () => openBk(r),
        title: nm + ', ' + lab(s) + '–' + lab(e) + ', ' + r.service + ' (' + (SRC[r.source] || 'Reserva') + ')',
        'aria-label': nm + ', ' + lab(s) + ', ' + r.service + ', ' + (SRC[r.source] || 'Reserva')},
        h('span', {class: 'l1'}, h('i', {class: 'pt ' + kind}), h('span', {class: 'nm'}, shortNm)),
        h('span', {class: 'l2'}, lab(s) + '–' + lab(e) + (wk && nar ? '' : ' · ' + r.service))));
    });
    if (showNow && c.date === today) col.append(h('div', {class: 'now', style: 'top:' + (now - lo) * PM + 'px'}));
    g.append(col);
  });
  if (fk) { const n = g.querySelector('[data-k="' + CSS.escape(fk) + '"]'); if (n) n.focus({preventScroll: true}); }
  if (pend) { pend = false; SC.scrollLeft = nar && wk ? Math.max(0, cols.findIndex(c => c.date === day) * cw) : 0; }
}

// Navigation: the label and picker update immediately, bookings follow
const busy = on => { $('grid').classList.toggle('busy', on); $('grid').setAttribute('aria-busy', on); };
const step = () => view === 'week' ? 7 : 1;
const go = d => { day = d; head(); $('cnt').textContent = ''; busy(true); load(); };
function setView(v) {
  view = v; pend = true;
  document.querySelectorAll('#vw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  $('bs').hidden = v !== 'week';
  go(day);
}
$('vw').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.v !== view) setView(b.dataset.v); };
$('bs').onchange = e => { const b = barbers.find(x => String(x.id) === e.target.value); if (b) { bsel = b.id; draw(); } };
$('pv').onclick = () => go(addDays(day, -step()));
$('nx').onclick = () => go(addDays(day, step()));
$('td').onclick = () => go(fd(new Date()));
$('dp').onchange = e => { if (e.target.value) go(e.target.value); };
$('nw').onclick = openNew;
$('cal').onclick = () => { const d = $('dp'); try { d.showPicker(); } catch (e) { d.focus(); d.click(); } };
addEventListener('resize', () => { const d = dims(view === 'week'); if (drawn && d.nar + ':' + d.cw !== lastKey) draw(); });

// Keep the barber headers pinned just below the date bar (0 on phones, where the bar scrolls away)
const syncBar = () => { const b = document.querySelector('.bar'); document.documentElement.style.setProperty('--barh', getComputedStyle(b).position === 'sticky' ? b.offsetHeight + 'px' : '0px'); };
new ResizeObserver(syncBar).observe(document.querySelector('.bar')); addEventListener('resize', syncBar);

// Dialogs
const D = $('dlg');
const show = (...k) => { D.replaceChildren(...k); if (!D.open) D.showModal(); };
const close = () => D.close();
const kv = (k, v) => h('div', {}, h('dt', {}, k), h('dd', {}, v));

function picker(svc, date) {
  const d = h('input', {type: 'date', value: date}), t = h('select');
  let seq = 0;
  const fill = async () => {
    const my = ++seq;
    if (!d.value) { t.replaceChildren(h('option', {value: ''}, 'Elige un día')); return; }
    t.replaceChildren(h('option', {value: ''}, 'Cargando...'));
    const {data, error} = await sb.rpc('dash_slots', {p_date: d.value, p_service: svc()});
    if (my !== seq) return; // a newer request replaced this one
    t.replaceChildren();
    if (error || !data || !data.length) { t.append(h('option', {value: ''}, error ? 'No se pudieron cargar los horarios' : 'Sin horarios libres')); return; }
    data.forEach(x => t.append(h('option', {value: x.slot_start}, ft(new Date(x.slot_start)))));
  };
  d.onchange = fill; fill();
  return {d, t, fill};
}

function openBk(r) {
  const bn = barbers.find(x => x.id === r.barber_id);
  const msg = h('p', {class: 'err'});
  const s = mn(new Date(r.requested_datetime));
  const phone = r.customer_phone
    ? h('a', {href: 'tel:' + r.customer_phone.replace(/[^\d+]/g, '')}, r.customer_phone)
    : 'Sin teléfono';
  show(
    h('h2', {}, h('i', {class: 'pt ' + (isMan(r) ? 'mn' : 'ph')}), r.customer_name || 'Sin nombre'),
    h('dl', {class: 'kv'},
      kv('Servicio', r.service),
      kv('Barbero', bn ? bn.name : 'Sin asignar'),
      kv('Hora', r.end_datetime ? lab(s) + '–' + lab(mn(new Date(r.end_datetime))) : lab(s)),
      kv('Teléfono', phone),
      kv('Origen', SRC[r.source] || 'Reserva')),
    msg,
    h('div', {class: 'row'},
      h('button', {class: 'btn pri', onclick: () => openMove(r)}, 'Cambiar hora'),
      h('button', {class: 'btn bad', onclick: async () => {
        if (!confirm('¿Cancelar esta reserva?')) return;
        const {data, error} = await sb.rpc('dash_cancel', {p_booking_id: r.id});
        if (error || !data || !data.ok) { msg.textContent = 'No se pudo cancelar la reserva.'; return; }
        close(); load();
      }}, 'Cancelar reserva'),
      h('button', {class: 'btn ghost', onclick: close}, 'Cerrar')));
}

function openMove(r) {
  const msg = h('p', {class: 'err'});
  const p = picker(() => r.service, fd(new Date(r.requested_datetime)));
  show(
    h('h2', {}, 'Cambiar hora'),
    h('p', {class: 'mut'}, (r.customer_name || 'Sin nombre') + ', ' + r.service),
    h('div', {class: 'stack'}, h('label', {}, 'Día', p.d), h('label', {}, 'Hora', p.t), msg),
    h('div', {class: 'row'},
      h('button', {class: 'btn pri', onclick: async () => {
        if (!p.t.value) { msg.textContent = 'Elige una hora libre.'; return; }
        const {data, error} = await sb.rpc('dash_reschedule', {p_booking_id: r.id, p_start: p.t.value});
        if (error || !data || !data.ok) { msg.textContent = 'Ese horario ya no está disponible. Elige otro.'; p.fill(); return; }
        close(); load();
      }}, 'Guardar cambio'),
      h('button', {class: 'btn ghost', onclick: close}, 'Cancelar')));
}

function openNew() {
  const msg = h('p', {class: 'err'});
  const name = h('input', {type: 'text', autocomplete: 'off'}), phone = h('input', {type: 'tel', autocomplete: 'off'});
  const svc = h('select', {}, ...services.map(s => h('option', {value: s.service_name}, s.service_name + ' (' + s.duration_minutes + ' min)')));
  const p = picker(() => svc.value, day);
  svc.onchange = p.fill;
  show(
    h('h2', {}, 'Nueva reserva'),
    h('div', {class: 'stack'},
      h('label', {}, 'Nombre del cliente', name), h('label', {}, 'Teléfono (opcional)', phone),
      h('label', {}, 'Servicio', svc), h('label', {}, 'Día', p.d), h('label', {}, 'Hora', p.t), msg),
    h('div', {class: 'row'},
      h('button', {class: 'btn pri', onclick: async () => {
        if (!name.value.trim()) { msg.textContent = 'Escribe el nombre del cliente.'; return; }
        if (!p.t.value) { msg.textContent = 'Elige una hora libre.'; return; }
        const {data, error} = await sb.rpc('dash_book', {p_name: name.value.trim(), p_phone: phone.value.trim(), p_service: svc.value, p_start: p.t.value});
        if (error || !data || !data.ok) { msg.textContent = 'Ese horario ya no está disponible. Elige otro.'; p.fill(); return; }
        close(); if (p.d.value !== day) day = p.d.value; load();
      }}, 'Guardar reserva'),
      h('button', {class: 'btn ghost', onclick: close}, 'Cancelar')));
}

// ---- Stats page (read-only): IA vs manual, by day and by month ----
let sm = '', met = 'ok', sgen = 0, sdata = null, sev = null;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const dim = ym => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
const shiftM = (ym, n) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);
const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '–';
const mk = () => ({ok: {ia: 0, man: 0}, can: {ia: 0, man: 0}, tg: 0, oth: 0});
const mlong = ym => fmt(ym + '-01', {month: 'long', year: 'numeric'});
const tick = () => { load(); if (!$('sv').hidden) loadStats(true); };
function showStats(on) {
  $('ag').hidden = on; $('sv').hidden = !on; $('st').textContent = on ? 'Agenda' : 'Estadísticas';
  if (on) { if (!sm) sm = fd(new Date()).slice(0, 7); shead(); loadStats(); }
}
function shead() {
  const cur = fd(new Date()).slice(0, 7);
  $('sl').textContent = cap(mlong(sm));
  $('sx').disabled = sm >= cur; $('sc').disabled = sm === cur;
  document.querySelectorAll('#mt button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === met));
}
const sbusy = on => { $('sb').classList.toggle('busy', on); $('sb').setAttribute('aria-busy', on); };
async function loadStats(bg) {
  const my = ++sgen, first = shiftM(sm, -11) + '-01', last = sm + '-' + String(dim(sm)).padStart(2, '0');
  const a = addDays(first, -1) + 'T12:00:00Z', z = addDays(last, 1) + 'T12:00:00Z';
  if (!bg) sbusy(true);
  let rows = [], from = 0, err = null;
  for (;;) { // the API returns at most 1000 rows per request
    const {data, error} = await sb.from('bookings').select('requested_datetime,status,source,service')
      .gte('requested_datetime', a).lt('requested_datetime', z).order('requested_datetime').order('id').range(from, from + 999);
    if (error) { err = error; break; }
    rows = rows.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  if (my !== sgen) return; // a newer month or request replaced this one
  let evs = null; // change log (reschedules / cancellations); optional
  if (!err) {
    evs = [];
    for (let f = 0;;) {
      const {data, error} = await sb.from('booking_events').select('kind,actor,created_at')
        .gte('created_at', addDays(sm + '-01', -1) + 'T12:00:00Z').lt('created_at', addDays(last, 1) + 'T12:00:00Z').order('created_at').order('id').range(f, f + 999);
      if (error) { evs = null; break; } // table not installed yet: hide that section
      evs = evs.concat(data || []);
      if (!data || data.length < 1000) break;
      f += 1000;
    }
    if (my !== sgen) return;
  }
  sbusy(false);
  if (err) {
    if (bg && sdata) return;
    $('sb').replaceChildren(h('p', {class: 'err'}, 'No se pudieron cargar las estadísticas. ', h('button', {class: 'btn', onclick: () => loadStats()}, 'Reintentar')));
    return;
  }
  sdata = rows; sev = evs; drawStats();
}
function drawStats() {
  shead();
  const mo = {}, svc = {}, now = new Date(), days = Array.from({length: dim(sm)}, mk);
  for (let i = 11; i >= 0; i--) mo[shiftM(sm, -i)] = mk();
  let up = 0;
  sdata.forEach(r => {
    const d = fd(new Date(r.requested_datetime)), M = mo[d.slice(0, 7)];
    if (!M) return;
    const t = d.slice(0, 7) === sm ? [M, days[+d.slice(8) - 1]] : [M], k = r.source === 'dashboard' ? 'man' : 'ia';
    t.forEach(x => {
      if (r.status === 'confirmed') { x.ok[k]++; if (r.source === 'telegram') x.tg++; }
      else if (r.status === 'cancelled') x.can[k]++;
      else x.oth++;
    });
    if (d.slice(0, 7) === sm && (r.status === 'confirmed' || r.status === 'cancelled')) {
      const nm = r.service || 'Sin servicio', e = svc[nm] || (svc[nm] = {ok: {ia: 0, man: 0}, can: {ia: 0, man: 0}});
      e[r.status === 'confirmed' ? 'ok' : 'can'][k]++;
      if (r.status === 'confirmed' && new Date(r.requested_datetime) > now) up++;
    }
  });
  const M = mo[sm], oka = M.ok.ia, okm = M.ok.man, ok = oka + okm, ca = M.can.ia, cm = M.can.man, can = ca + cm, ml = mlong(sm);
  const lead1 = ok || can
    ? ok + (ok === 1 ? ' reserva' : ' reservas') + ' en ' + ml + (ok ? ': ' + oka + ' por IA (' + pct(oka, ok) + ') y ' + okm + (okm === 1 ? ' manual.' : ' manuales.') : '.')
    : 'Sin reservas en ' + ml + '.';
  const lead2 = can ? can + (can === 1 ? ' cancelada' : ' canceladas') + ' (' + pct(can, ok + can) + ' del total): ' + ca + ' de IA y ' + cm + ' manuales.' : ok ? 'Ninguna cancelación.' : '';
  const ev = {re: {ia: 0, man: 0}, ca: {ia: 0, man: 0}};
  (sev || []).forEach(e => { if (fd(new Date(e.created_at)).slice(0, 7) === sm) ev[e.kind === 'rescheduled' ? 're' : 'ca'][e.actor === 'ai' ? 'ia' : 'man']++; });
  const lead3 = sev && ev.re.ia ? 'La IA reprogramó ' + ev.re.ia + (ev.re.ia === 1 ? ' cita' : ' citas') + ' este mes.' : '';
  const erow = (cls, name, a, c) => h('tr', {}, h('th', {scope: 'row'}, h('span', {class: 'nmc'}, cls ? h('i', {class: 'pt ' + cls}) : '', name)), h('td', {}, String(a)), h('td', {}, String(c)));
  const etbl = sev ? h('section', {class: 'panel'},
    h('div', {class: 'ph2'}, h('h2', {}, 'Cambios de reserva, por quién')),
    h('table', {}, h('thead', {}, h('tr', {}, h('th', {scope: 'col'}, 'Canal'), h('th', {scope: 'col'}, 'Reprogramadas'), h('th', {scope: 'col'}, 'Canceladas'))),
      h('tbody', {}, erow('ph', 'IA', ev.re.ia, ev.ca.ia), erow('mn', 'Manual', ev.re.man, ev.ca.man), erow('', 'Total', ev.re.ia + ev.re.man, ev.ca.ia + ev.ca.man)))) : '';
  const row = (cls, name, o, c) => h('tr', {}, h('th', {scope: 'row'}, h('span', {class: 'nmc'}, cls ? h('i', {class: 'pt ' + cls}) : '', name)), h('td', {}, String(o)), h('td', {}, String(c)), h('td', {}, pct(c, o + c)));
  const table = h('section', {class: 'panel'},
    h('div', {class: 'ph2'}, h('h2', {}, 'Por canal')),
    h('table', {}, h('thead', {}, h('tr', {}, h('th', {scope: 'col'}, 'Canal'), h('th', {scope: 'col'}, 'Reservas'), h('th', {scope: 'col'}, 'Canceladas'), h('th', {scope: 'col'}, 'Cancelación'))),
      h('tbody', {}, row('ph', 'IA', oka, ca), row('mn', 'Manual', okm, cm), row('', 'Total', ok, can))));
  const srows = Object.entries(svc).map(([n, e]) => [n, e[met].ia, e[met].man]).filter(x => x[1] + x[2])
    .sort((a, b) => b[1] + b[2] - a[1] - a[2] || a[0].localeCompare(b[0], 'es'));
  const sTot = srows.reduce((t, x) => [t[0] + x[1], t[1] + x[2]], [0, 0]);
  const th2 = (cls, t) => h('th', {scope: 'col'}, h('span', {class: 'nmc'}, h('i', {class: 'pt ' + cls}), t));
  const tr2 = (n, a, m) => h('tr', {}, h('th', {scope: 'row'}, n), h('td', {}, String(a)), h('td', {}, String(m)), h('td', {}, String(a + m)));
  const stbl = h('section', {class: 'panel svc'},
    h('div', {class: 'ph2'}, h('h2', {}, met === 'ok' ? 'Servicios' : 'Servicios cancelados')),
    srows.length
      ? h('table', {}, h('thead', {}, h('tr', {}, h('th', {scope: 'col'}, 'Servicio'), th2('ph', 'IA'), th2('mn', 'Manual'), h('th', {scope: 'col'}, 'Total'))),
          h('tbody', {}, ...srows.map(x => tr2(x[0], x[1], x[2])), tr2('Total', sTot[0], sTot[1])))
      : h('p', {class: 'fn'}, 'Sin datos este mes.'));
  const panel = (title, items, label) => {
    const mx = Math.max(1, ...items.map(x => x.ia + x.man));
    const bar = (v, c) => h('i', {class: c, style: 'height:' + v / mx * 100 + '%' + (v ? ';min-height:2px' : '')});
    return h('section', {class: 'panel'},
      h('div', {class: 'ph2'}, h('h2', {}, title), h('span', {class: 'lgd'}, h('i', {class: 'pt ph'}), 'IA', h('i', {class: 'pt mn'}), 'Manual', h('b', {}, 'Máx. ' + mx))),
      h('div', {class: 'cht', role: 'img', 'aria-label': label}, ...items.map(x => h('div', {class: 'bc', title: x.tip}, bar(x.man, 'm'), bar(x.ia, 'a')))),
      h('div', {class: 'ax'}, ...items.map(x => h('span', {}, x.lab))));
  };
  const what = met === 'ok' ? 'Reservas' : 'Cancelaciones';
  const dItems = days.map((d, i) => ({ia: d[met].ia, man: d[met].man, lab: i === 0 || (i + 1) % 5 === 0 ? String(i + 1) : '',
    tip: fmt(sm + '-' + String(i + 1).padStart(2, '0'), {day: 'numeric', month: 'long'}) + ': ' + d[met].ia + ' IA, ' + d[met].man + ' manual'}));
  const mItems = Object.entries(mo).map(([k, d]) => ({ia: d[met].ia, man: d[met].man, lab: fmt(k + '-01', {month: 'short'}),
    tip: cap(mlong(k)) + ': ' + d[met].ia + ' IA, ' + d[met].man + ' manual'}));
  const notes = [met === 'ok' && up ? up + (up === 1 ? ' reserva de este mes es una cita que aún no ha pasado.' : ' reservas de este mes son citas que aún no han pasado.') : '', M.tg ? 'IA incluye reservas por teléfono y por Telegram (' + M.tg + ' por Telegram este mes).' : '', M.oth ? M.oth + ' reservas con otro estado no se cuentan.' : '', 'Las reservas y cancelaciones de las tablas y gráficos se cuentan en el canal que creó la reserva y en el día de la cita.', sev ? 'Los cambios de reserva (por quién) se registran desde que se activó el registro: no hay datos anteriores.' : ''].filter(Boolean);
  $('sb').replaceChildren(
    h('p', {class: 'lead'}, lead1, lead2 ? h('span', {}, lead2) : '', lead3 ? h('span', {}, lead3) : ''),
    table,
    etbl,
    stbl,
    panel(what + ' por día', dItems, what + ' por día en ' + ml),
    panel(what + ' por mes, últimos 12 meses', mItems, what + ' por mes, últimos 12 meses'),
    h('p', {class: 'fn'}, notes.join(' ')));
}
$('st').onclick = () => showStats($('sv').hidden);
$('mt').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.m !== met) { met = b.dataset.m; if (sdata) drawStats(); else shead(); } };
$('sp').onclick = () => { sm = shiftM(sm, -1); sdata = null; shead(); loadStats(); };
$('sx').onclick = () => { sm = shiftM(sm, 1); sdata = null; shead(); loadStats(); };
$('sc').onclick = () => { sm = fd(new Date()).slice(0, 7); sdata = null; shead(); loadStats(); };
</script>
</body>
</html>
